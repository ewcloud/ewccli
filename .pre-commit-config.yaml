---
exclude: (^|/)ewccli/tests/|(^|/)ewccli/backends/kubernetes/|(^|/)ewccli/commands/dns_command.py|(^|/)ewccli/commands/k8s_command.py|(^|/)ewccli/commands/s3_command.py

repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
        exclude: |
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: name-tests-test
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff-check
        args: [ --fix ]
        exclude: |
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py
      - id: ruff-format
        exclude: |
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-setuptools
        args:
          - --show-error-codes
          - --pretty
        exclude: |
          ^(docs|tasks|tests)|setup\.py|
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py

  - repo: https://github.com/psf/black
    rev: "25.1.0"
    hooks:
      - id: black
        args:
          - --check
          - --diff
        exclude: |
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py

  - repo: https://github.com/PyCQA/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-comprehensions
          - flake8-cognitive-complexity
          - flake8-functions
          - flake8-length
          - pep8-naming
        args:
          - --max-line-length=120
          - --max-complexity=10
        exclude: |
          (^|/)ewccli/backends/kubernetes/|
          (^|/)ewccli/commands/dns_command.py
