name: Validation

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -e .[test]
        
      - name: Run pre-commit
        run: pre-commit run --all-files

  unittest:
    name: Unittesting
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install -e .[test]
        
      - name: Run pytest
        run: pytest

  e2e:
    name: End-to-end Testing
    runs-on: ubuntu-latest
    needs: unittest
    if: ${{ always() }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    env:
      EWC_CLI_LOGIN_FEDEREE: 'ECMWF'
      EWC_CLI_LOGIN_REGION: '${{ secrets.ECMWF_EWC_CLI_LOGIN_REGION }}'
      ITEM_NAME: ssh-bastion-flavour
      INPUT_SPEC_JSON: ''
      CATALOG_REF: main
      EWC_CLI_LOGIN_TENANT_NAME: '${{ secrets.ECMWF_EWC_CLI_LOGIN_TENANT_NAME }}'
      OS_APPLICATION_CREDENTIAL_ID: '${{ secrets.ECMWF_OS_APPLICATION_CREDENTIAL_ID }}'
      OS_APPLICATION_CREDENTIAL_SECRET: '${{ secrets.ECMWF_OS_APPLICATION_CREDENTIAL_SECRET }}'
      OS_AUTH_URL: '${{ secrets.ECMWF_OS_AUTH_URL }}'
      OS_REGION_NAME: '${{ secrets.ECMWF_OS_REGION_NAME }}'
      ANSIBLE_SSH_PRIVATE_KEY: '${{ secrets.ECMWF_ANSIBLE_SSH_PRIVATE_KEY }}'
      ANSIBLE_SSH_PUBLIC_KEY: '${{ secrets.ECMWF_ANSIBLE_SSH_PUBLIC_KEY }}'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install EWCCLI and its dependencies
        run: pip install .

      - name: Test deployment
        run: .github/scripts/test-deployment-ansible.sh

      - name: Upload test deployment result
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifacts_${{ github.run_id }}
          path: ./artifacts
